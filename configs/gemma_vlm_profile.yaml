alias: gemma31
label: "Gemma 4 31B IT Q4_K_M (VLM)"
role: primary_vlm
status: active

model:
  id: "gemma-4-31B-it-Q4_K_M.gguf"
  path: "/mnt/c/ai_models/language/vlm/gemma-4-31B-it-GGUF/gemma-4-31B-it-Q4_K_M.gguf"
  size_gb: ~20
  quantization: Q4_K_M
  family: gemma4

mmproj:
  path: "/mnt/c/ai_models/language/vlm/gemma-4-31B-it-GGUF/mmproj-F16.gguf"
  offload: cpu   # --no-mmproj-offload
  size_mb: ~240

launch:
  ctx_size: 131072
  n_gpu_layers: 99
  max_tokens: 8192
  batch_size: 2048
  ubatch_size: 1152
  parallel: 1
  image_max_tokens: 1120
  media_path: "~/.openclaw/media/inbound"
  reasoning: "off"
  reasoning_budget: 0

vram_profile:
  model_weights_gb: ~20
  kv_cache_ctx131k_gb: ~9
  total_gb: ~29
  limit_gb: 34.2
  safe: true

openclaw:
  input: ["text", "image"]
  context_window: 131072
  max_tokens: 8192
  timeout_seconds: 240

known_issues:
  - "400 Failed to tokenize prompt on complex tool payloads (embedded agent)"
  - "[chat.history omitted] in webchat multi-turn image (fix: /img skill)"
